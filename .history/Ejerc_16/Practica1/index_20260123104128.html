<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Auditoría</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }

    .error {
      background-color: #ffcccc;
    }

    #total {
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>📊 Dashboard de Auditoría</h1>
  <div id="total">Consumo Total: -- MB</div>

  <table>
    <thead>
      <tr>
        <th>ID Sesión</th>
        <th>Usuario</th>
        <th>Consumo (MB)</th>
      </tr>
    </thead>
    <tbody id="tablaLogs"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
