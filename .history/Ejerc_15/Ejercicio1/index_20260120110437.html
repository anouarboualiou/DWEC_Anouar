<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Procesador de Imágenes</title>
  <style>
    #dropzone {
      border: 2px dashed #aaa;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
    }
    .preview {
      display: inline-block;
      margin: 10px;
    }
    img {
      max-width: 150px;
      display: block;
    }
  </style>
</head>
<body>

  <h2>Arrastra imágenes aquí</h2>
  <div id="dropzone">Drop images here</div>

  <div>
    <label>Marca de agua:</label>
    <input type="text" id="watermark" value="© Mi App" />
  </div>

  <div>
    <label>Ancho máximo:</label>
    <input type="number" id="maxWidth" value="800" />
  </div>

  <div>
    <label>Formato salida:</label>
    <select id="format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/png">PNG</option>
    </select>
  </div>

  <button id="process">Procesar</button>

  <h3>Resultados</h3>
  <div id="output"></div>

  <div id="previews"></div>

  <script src="app.js"></script>
</body>
</html>
