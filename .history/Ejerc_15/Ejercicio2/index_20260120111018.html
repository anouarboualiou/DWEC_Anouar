<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tablero Kanban</title>

    <link rel="style" href="./style.css">
</head>

<body>

    <h1>Tablero Kanban</h1>

    <div class="board">

        <div class="column" data-status="todo">
            <h3>Por hacer</h3>
            <div class="card" draggable="true" data-id="1">Tarea 1</div>
            <div class="card" draggable="true" data-id="2">Tarea 2</div>
            <div class="card" draggable="true" data-id="3">Tarea 3</div>
        </div>

        <div class="column" data-status="progress">
            <h3>En progreso</h3>
        </div>

        <div class="column" data-status="done">
            <h3>Finalizado</h3>
        </div>

    </div>

    <script src="./script.js"></script>

</body>

</html>
